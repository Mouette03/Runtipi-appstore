services:
  triliumnext:
    image: 'ghcr.io/triliumnext/trilium:v0.104.1'
    volumes:
      - '${APP_DATA_DIR}/data:/home/node/trilium-data'
    environment:
      - 'TRILIUM_DATA_DIR=/home/node/trilium-data'
    x-runtipi:
      internal_port: 8080
      is_main: true
x-runtipi:
  schema_version: 2
