services:
  duckdns:
    image: 'ghcr.io/linuxserver/duckdns:version-d67e71cc'
    volumes:
      - '${APP_DATA_DIR}/data/config:/config'
    environment:
      - 'PUID=1000'
      - 'PGID=1000'
      - 'TZ=${TZ}'
      - 'SUBDOMAINS=${DUCKDNS_SUBDOMAINS}'
      - 'TOKEN=${DUCKDNS_TOKEN}'
      - 'UPDATE_IP=${DUCKDNS_UPDATE_IP}'
      - 'LOG_FILE=${DUCKDNS_ENABLE_LOG_FILE}'
x-runtipi:
  schema_version: 2
