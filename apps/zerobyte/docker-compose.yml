services:
  zerobyte:
    image: 'ghcr.io/nicotsx/zerobyte:v0.42.0'
    restart: 'unless-stopped'
    volumes:
      - '${APP_DATA_DIR}/data:/var/lib/zerobyte'
      - '${ZEROBYTE_BACKUP_PATH}:/data:ro'
      - '/etc/localtime:/etc/localtime:ro'
    environment:
      - 'TZ=${TZ}'
      - 'BASE_URL=${APP_PROTOCOL}://${APP_DOMAIN}'
      - 'APP_SECRET=${APP_SECRET}'
    x-runtipi:
      internal_port: 4096
      is_main: true
x-runtipi:
  schema_version: 2
